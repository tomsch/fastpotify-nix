name: Auto Update

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v27

      - name: Test updater
        run: python3 tests/test_updater.py

      - name: Check for updates
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST_TAG=$(curl -fsSL \
            -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/crmne/fastpotify/releases/latest" |
            jq -er '.tag_name')
          LATEST_VERSION="${LATEST_TAG#v}"
          CURRENT=$(grep 'version = ' package.nix | head -1 | sed 's/.*"\(.*\)".*/\1/')

          {
            echo "current=$CURRENT"
            echo "latest=$LATEST_VERSION"
            echo "latest_tag=$LATEST_TAG"
            if [ "$LATEST_VERSION" != "$CURRENT" ]; then
              echo "needs_update=true"
            else
              echo "needs_update=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Update package and dependency pins
        if: steps.check.outputs.needs_update == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./update.sh --no-build

      - name: Test build
        if: steps.check.outputs.needs_update == 'true'
        run: |
          nix build .#fastpotify --accept-flake-config

      - name: Commit and push
        if: steps.check.outputs.needs_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.nix Cargo.lock
          git commit -m "Update fastpotify to ${{ steps.check.outputs.latest }}"
          git push

      - name: Ensure Release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/ensure-release.sh \
            "${{ steps.check.outputs.latest }}" \
            "${{ steps.check.outputs.latest_tag }}"
